# Template for the local endpoint vault.
#
# Copy to `secrets/providers.properties` (git-ignored) and fill in the real values.
# A build without that file still succeeds — it simply produces an empty vault, and
# any provider call then fails with a clear "not provisioned" error instead of shipping
# a placeholder host.
#
# Keys are the slots the app requests (ProviderKey). Referer-style values keep their
# trailing slash because they are sent verbatim.

catalog_api=https://catalog.example.invalid
stream_host=https://stream.example.invalid
stream_referer=https://stream.example.invalid/
stream_domains=https://stream.example.invalid/domains
stream_referers=https://stream.example.invalid/
player_marker=player
embed_aes_key=0000000000000000
embed_aes_iv=0000000000000000
dub_host_a=https://dub-a.example.invalid
dub_host_b=https://dub-b.example.invalid
dub_host_b_referer=https://dub-b.example.invalid/
dub_cdn=https://cdn.example.invalid
dub_gate_host=gate.example.invalid
dub_gate_path=/gate
dub_embed_marker=gate
dub_watch_marker=WatchNow
dub_slug_prefix_a=a-
dub_slug_prefix_b=b-
sub_a=https://subs-a.example.invalid/
sub_b=https://subs-b.example.invalid/
sub_b_cdn=https://dl.subs-b.example.invalid
sub_c=https://subs-c.example.invalid/

# Alternative stream source: comma-separated API shards.
source_b_shards=https://shard-a.example.invalid,https://shard-b.example.invalid
source_b_origin=https://stream.example.invalid
source_b_referer=https://cdn.example.invalid/
source_b_user_agent=okhttp/4.9.3

mirror_api=https://example.invalid
mirror_player=https://example.invalid
archive_host=https://example.invalid
skip_api=https://example.invalid

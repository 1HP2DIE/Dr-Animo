name: update-feed

# Keeps docs/update.json and the "Version history" block in docs/index.html in sync with
# the GitHub releases. The app polls update.json, so a published release reaches installed
# builds without shipping a new APK first.
on:
  release:
    types: [published, edited, deleted, unpublished]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-feed
  cancel-in-progress: true

jobs:
  feed:
    runs-on: ubuntu-latest
    steps:
      # A `release` event checks out the tag, i.e. a detached HEAD, and the push below then fails
      # with "You are not currently on a branch". The feed belongs on the default branch, so ask
      # for it explicitly; the release tags are still fetched for the version lookup.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true

      - name: Assert the feed cap
        run: python3 tools/update_feed.py --selftest

      - name: Regenerate the feed from releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 tools/update_feed.py

      - name: Commit if anything moved
        run: |
          # `generated` is a timestamp: it moves on every run and must not create a commit.
          # docs/download is part of the feed too: apkUrl points at the Pages mirror, so an APK that
          # is written but never committed is a 404 on the site's own download link.
          if git diff --quiet -I'"generated"' -- docs/update.json docs/index.html docs/sitemap.xml docs/download; then
            echo "feed already current"
            exit 0
          fi
          git config user.name  "dr-animo-bot"
          git config user.email "bot@1hp2die.invalid"
          # -A, so the pruned previous APK (the mirror keeps only the newest) is staged as a deletion.
          git add -A docs/update.json docs/index.html docs/sitemap.xml docs/download
          git commit -m "chore(feed): sync update.json with the latest release [skip ci]"
          git push
